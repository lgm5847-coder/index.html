<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Dólar y Euro BCV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 380px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .rate-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .rate-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rate-box.euro {
            border-left-color: #10b981;
        }
        .currency-name {
            font-size: 16px;
            font-weight: bold;
            color: #cbd5e1;
            text-align: left;
        }
        .currency-value {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .update-time {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        .loading {
            color: #f59e0b;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Tasas Oficiales (BCV)</h2>
        <div class="subtitle">Actualización diaria en tiempo real</div>

        <div class="rate-container">
            <div class="rate-box">
                <div class="currency-name">🇺🇸 Dólar BCV</div>
                <div class="currency-value" id="dolarVal"><span class="loading">Cargando...</span></div>
            </div>
            <div class="rate-box euro">
                <div class="currency-name">🇪🇺 Euro BCV</div>
                <div class="currency-value" id="euroVal"><span class="loading">Cargando...</span></div>
            </div>
        </div>

        <div class="update-time" id="updateTime">Última actualización: --:--</div>
        
        <button onclick="fetchRates()">Actualizar Precios</button>
    </div>

    <script>
        async function fetchRates() {
            document.getElementById('dolarVal').innerHTML = '<span class="loading">Cargando...</span>';
            document.getElementById('euroVal').innerHTML = '<span class="loading">Cargando...</span>';

            try {
                // Usamos una API pública de intercambio especializada en tasas de Venezuela
                const response = await fetch('https://pydolarve.org/api/v1/dollar?page=bcv');
                const data = await response.json();

                if (data && data.monitors) {
                    const dolar = data.monitors.usd ? data.monitors.usd.price : 'N/D';
                    const euro = data.monitors.eur ? data.monitors.eur.price : 'N/D';

                    document.getElementById('dolarVal').innerText = `${dolar} Bs`;
                    document.getElementById('euroVal').innerText = `${euro} Bs`;
                } else {
                    throw new Error("Formato de datos no válido");
                }
            } catch (error) {
                // Plan de respaldo (Fallback) en caso de que falle la primera API
                try {
                    const responseAlt = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                    const dataAlt = await responseAlt.json();
                    if (dataAlt && dataAlt.promedio) {
                        document.getElementById('dolarVal').innerText = `${dataAlt.promedio} Bs`;
                        document.getElementById('euroVal').innerText = `Calculando...`;
                    } else {
                        throw new Error();
                    }
                } catch (err) {
                    document.getElementById('dolarVal').innerText = "Error de red";
                    document.getElementById('euroVal').innerText = "Error de red";
                }
            }

            const now = new Date();
            document.getElementById('updateTime').innerText = `Última actualización: ${now.toLocaleDateString()} a las ${now.toLocaleTimeString()}`;
        }

        // Cargar al abrir la app
        fetchRates();

        // Nota sobre la automatización a las 5:00 AM:
        // Como la app corre en tu navegador web, se actualizará sola cada vez que abras el acceso directo 
        // o si dejas la pestaña abierta a las 5:00 AM (el script chequeará si deseas programar un intervalo automático).
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 5 && now.getMinutes() === 0) {
                fetchRates();
            }
        }, 60000); // Revisa cada minuto si son las 5:00 AM
    </script>
</body>
</html>
